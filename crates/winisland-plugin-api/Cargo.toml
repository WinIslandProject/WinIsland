[package]
name = "winisland-plugin-api"
version = "0.7.0"
edition = "2024"
description = "Versioned native plugin ABI for WinIsland, with optional packaging and signing tools"
repository = "https://github.com/WinIslandProject/WinIsland"
homepage = "https://github.com/WinIslandProject/WinIsland"
license = "MIT"
keywords = ["plugin", "dynamic-island", "winisland"]
categories = ["api-bindings", "development-tools::build-utils"]
readme = "README.md"

[features]
default = ["sdk"]
sdk = []
packager = [
    "dep:winisland-plugin-package",
    "dep:ed25519-dalek",
    "dep:tempfile",
    "dep:log",
    "dep:libloading",
    "dep:toml",
]

[dependencies]
winisland-plugin-package = { path = "../winisland-plugin-package", optional = true }
toml = { version = "1.1.2", optional = true }
ed25519-dalek = { version = "2", features = ["pem", "pkcs8"], optional = true }
tempfile = { version = "3", optional = true }
log = { version = "0.4", optional = true }
libloading = { version = "0.9", optional = true }

[package.metadata.docs.rs]
features = ["packager"]
