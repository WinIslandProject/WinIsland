name: Validate PR Branch Name

on:
  pull_request_target:
    types: [ opened, synchronize ]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    if: github.repository != github.event.pull_request.head.repo.full_name
    runs-on: ubuntu-latest

    env:
      BRANCH: ${{ github.head_ref }}
      ALLOWED_PREFIXES: 'feat|fix|hotfix|refactor|chore|docs|test|ci|build|perf|style|revert|release|deps|security'

    steps:
      - name: Check branch name against CONTRIBUTING.md § 4.1
        id: check
        run: |
          echo "Checking branch: $BRANCH"
          echo "Allowed prefixes: $ALLOWED_PREFIXES"

          if [[ "$BRANCH" == "main" || "$BRANCH" == "master" ]]; then
            echo "valid=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$BRANCH" =~ ^(${ALLOWED_PREFIXES})/[A-Za-z0-9][A-Za-z0-9._-]*(/[A-Za-z0-9][A-Za-z0-9._-]*)*$ ]]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Close invalid PR
        if: steps.check.outputs.valid == 'false'
        uses: superbrothers/close-pull-request@v3
        with:
          comment: |
            Thanks for your contribution! However, the branch name `${{ github.head_ref }}` does not comply with our naming policy.

            Please refer to our **[CONTRIBUTING.md § 4.1 – Branch Naming](https://github.com/WinIslandProject/WinIsland/blob/master/CONTRIBUTING.md#41-branch-naming)**.

            **Allowed prefixes:**
            - `feat/` — new feature
            - `fix/` — bug fix
            - `hotfix/` — urgent bug fix
            - `refactor/` — refactoring
            - `chore/` — chores (dependency updates, build config, etc.)
            - `docs/` — documentation updates
            - `test/` — tests
            - `ci/` — CI changes
            - `build/` — build system changes
            - `perf/` — performance improvements
            - `style/` — code style changes
            - `revert/` — revert changes
            - `release/` — release branches
            - `deps/` — dependency updates
            - `security/` — security fixes

            **Important:** Please **do not** open pull requests directly from `main` or `master`.

            To fix this:
            1. Close this PR.
            2. Rename your branch to follow the naming convention (e.g., `feat/add-login`).
            3. Open a new PR with the renamed branch.

            Thank you for your understanding! 🙏

      - name: Fail if branch is invalid
        if: steps.check.outputs.valid == 'false'
        run: exit 1
