name: Add PR to Project Board

on:
  pull_request:
    types: [opened, reopened, closed]

jobs:
  project-board:
    name: Update PR on project board
    runs-on: ubuntu-latest
    steps:
      # 1) PR 创建/重新打开时，先把 PR 加入 project（默认落在 Needs review 列）
      - name: Add PR to project
        if: github.event.action == 'opened' || github.event.action == 'reopened'
        uses: actions/add-to-project@v2.0.0
        with:
          project-url: https://github.com/orgs/WinIslandProject/projects/2
          github-token: ${{ secrets.PROJECT_TOKEN }}

      # 2) 根据事件设置/更新 Status 列
      #    opened/reopened -> Needs review
      #    closed + merged -> Merge
      #    closed + !merged -> Close without merging
      - name: Set project status
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const ORG = 'WinIslandProject';
            const PROJECT_NUMBER = 2;
            const STATUS_FIELD_NAME = 'Status'; // 如果你的 project 单选框字段名不同，改这里

            const pr = context.payload.pull_request;
            const action = context.payload.action;

            let targetStatus;
            if (action === 'closed') {
              targetStatus = pr.merged ? 'Merge' : 'Close without merging';
            } else {
              targetStatus = 'Needs review';
            }

            const projectData = await github.graphql(`
              query($org: String!, $number: Int!, $fieldName: String!) {
                organization(login: $org) {
                  projectV2(number: $number) {
                    id
                    field(name: $fieldName) {
                      ... on ProjectV2SingleSelectField {
                        id
                        options { id name }
                      }
                    }
                  }
                }
              }
            `, { org: ORG, number: PROJECT_NUMBER, fieldName: STATUS_FIELD_NAME });

            const project = projectData.organization.projectV2;
            if (!project) throw new Error('Project not found');
            const statusField = project.field;
            if (!statusField) throw new Error(`Field "${STATUS_FIELD_NAME}" not found on project`);

            const option = statusField.options.find(o => o.name === targetStatus);
            if (!option) {
              throw new Error(
                `Status option "${targetStatus}" not found. Available: ${statusField.options.map(o => o.name).join(', ')}`
              );
            }

            const itemsData = await github.graphql(`
              query($contentId: ID!) {
                node(id: $contentId) {
                  ... on PullRequest {
                    projectItems(first: 50) {
                      nodes {
                        id
                        project { id }
                      }
                    }
                  }
                }
              }
            `, { contentId: pr.node_id });

            let item = itemsData.node.projectItems.nodes.find(n => n.project.id === project.id);

            if (!item) {
              const addData = await github.graphql(`
                mutation($projectId: ID!, $contentId: ID!) {
                  addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                    item { id }
                  }
                }
              `, { projectId: project.id, contentId: pr.node_id });
              item = { id: addData.addProjectV2ItemById.item.id };
            }

            await github.graphql(`
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId
                  itemId: $itemId
                  fieldId: $fieldId
                  value: { singleSelectOptionId: $optionId }
                }) {
                  projectV2Item { id }
                }
              }
            `, {
              projectId: project.id,
              itemId: item.id,
              fieldId: statusField.id,
              optionId: option.id,
            });
