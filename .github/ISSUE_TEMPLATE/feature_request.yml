name: Feature Request
description: Request a new feature or major enhancement
title: "[Feature] "
labels: ["enhancement", "pending"]
assignees: []
body:
  - type: input
    id: summary
    attributes:
      label: Summary
      description: Summarize the requested feature in one sentence
      placeholder: One-line summary
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this needed, and what problem does it solve?
      placeholder: Explain why this feature is needed
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed design or implementation
      description: "Optional: propose an API, configuration, UI, or data-flow design"
      placeholder: Describe the proposal or provide an example
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe other approaches and why they are less suitable
      placeholder: Alternatives or trade-offs
    validations:
      required: false

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Which modules will be affected?
      placeholder: List affected files or modules
    validations:
      required: false

  - type: textarea
    id: mockups
    attributes:
      label: UI mockups
      description: "Optional: attach mockups, links, or screenshots"
      placeholder: Paste an image link or describe the mockup
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Explain how to verify that the feature is complete
      placeholder: List the acceptance steps
    validations:
      required: true

  - type: checkboxes
    id: check-list
    attributes:
      label: Checklist
      description: Check all inspections according to the checklist below.
      options:
        - label: "I'm running the official release build (GitHub Releases), not a fork or third-party build"
          required: false
        - label: "I confirm that I'm running the latest version, whether stable or nightly"
          required: false
        - label: "I confirm that I have provided my Windows version and build number (e.g. Windows 11 23H2, build 22631)"
          required: false
        - label: "I confirm that I have searched for existing issues and this is not a duplicate"
          required: false
        - label: "I confirm that I have not read these checkboxes and therefore I just ticked them all."
          required: false
        - label: "I am well aware that if the issue is not filled out correctly and completely, it will simply be closed without any response or reason."
          required: false
